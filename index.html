<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SeatPlan – exam seating without clashes</title>
<style>
:root{--bg:#f3f5f2;--ink:#17211b;--mute:#5d6b62;--line:#cfd8d1;--card:#fff;--acc:#1f5e4a;--bad:#b3261e;--warn:#9a6700}
@media(prefers-color-scheme:dark){:root{--bg:#121815;--ink:#e7eee9;--mute:#9bab9f;--line:#2b3a31;--card:#1a231e;--acc:#6fcfa6;--bad:#ff8a80;--warn:#e3b341}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Trebuchet MS","Segoe UI",sans-serif}
header{padding:20px 24px;border-bottom:1px solid var(--line)}h1{margin:0;font:700 26px Georgia,serif}header p{margin:4px 0 0;color:var(--mute)}
main{display:grid;grid-template-columns:300px 1fr;gap:20px;padding:20px 24px;max-width:1400px}
@media(max-width:850px){main{grid-template-columns:1fr}}
aside>div,.room,.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mute);margin-top:8px}
select,input,button{font:inherit;width:100%;padding:7px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
button{background:var(--acc);color:var(--bg);border:0;cursor:pointer;margin-top:8px;font-weight:700}button:hover{opacity:.9}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.stats{display:flex;gap:18px;flex-wrap:wrap}.stats b{display:block;font:700 22px Georgia,serif}
.grid{display:grid;gap:3px;margin-top:8px;overflow-x:auto}
.seat{height:26px;min-width:34px;border-radius:3px;font-size:10px;display:flex;align-items:center;justify-content:center;color:#10231a}
.seat.empty{background:transparent;border:1px dashed var(--line)}.seat.bent{outline:2px solid var(--bad)}
.log li{margin:4px 0}.ok{color:var(--acc)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.legend span{display:inline-block;padding:2px 8px;margin:2px;border-radius:3px;font-size:12px;color:#10231a}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}.room h3{margin:0;font-size:15px}.room small{color:var(--mute)}
</style></head><body>
<header><h1>SeatPlan</h1><p>Exam seating and invigilator roster. Replans in milliseconds and says which rule it had to bend.</p></header>
<main>
<aside>
<div><b>Exam setup</b>
<label>Students <input id="nS" type="number" value="240" min="10"></label>
<label>Subjects <input id="nSub" type="number" value="5" min="1" max="8"></label>
<label>Rooms <input id="nR" type="number" value="6" min="1" max="12"></label>
<label>Invigilators <input id="nI" type="number" value="9" min="1" max="30"></label>
<button id="gen">Generate and plan</button></div>
<div><b>Something dropped out</b>
<label>Room <select id="selR"></select></label><button class="sec" id="dropR">Remove room and replan</button>
<label>Invigilator <select id="selI"></select></label><button class="sec" id="dropI">Mark absent and replan</button>
<button class="sec" id="reset">Restore everything</button></div>
<div class="legend" id="legend"></div>
</aside>
<section>
<div class="panel stats" id="stats"></div>
<div class="panel"><b>What the planner did and what it bent</b><ul class="log" id="log"></ul></div>
<div class="rooms" id="rooms"></div>
</section></main>
<script>
const COLORS=["#9ad0b8","#f2c879","#a8c4ec","#e9a3b4","#c6b3e8","#f0a77c","#b9d98f","#8fd3d9"];
const PER_INV=30; // max students per invigilator
let data=null, state={deadRooms:new Set(),deadInv:new Set()}, prev=null;
const $=id=>document.getElementById(id);
function rng(s){return()=>(s=(s*1664525+1013904223)>>>0)/4294967296}
function generate(){
  const r=rng(42),nS=+$("nS").value,nSub=+$("nSub").value,nR=+$("nR").value,nI=+$("nI").value;
  const students=Array.from({length:nS},(_,i)=>({id:i+1,subject:Math.floor(r()*nSub)}));
  const rooms=Array.from({length:nR},(_,i)=>{const cols=[6,8,10][i%3],rows=[5,6,7][(i+1)%3];return{id:"R"+(i+1),rows,cols}});
  const invs=Array.from({length:nI},(_,i)=>({id:"Inv "+(i+1)}));
  data={students,rooms,invs,nSub};state={deadRooms:new Set(),deadInv:new Set()};prev=null;fillSelects();
}
function fillSelects(){
  $("selR").innerHTML=data.rooms.map(r=>`<option>${r.id}</option>`).join("");
  $("selI").innerHTML=data.invs.map(r=>`<option>${r.id}</option>`).join("");
  $("legend").innerHTML="<b>Subjects</b><br>"+Array.from({length:data.nSub},(_,i)=>`<span style="background:${COLORS[i]}">Subject ${i+1}</span>`).join("");
}
/* ---- planner ---- */
function plan(){
  const t0=performance.now(),log=[];
  const rooms=data.rooms.filter(r=>!state.deadRooms.has(r.id));
  const invs=data.invs.filter(i=>!state.deadInv.has(i.id));
  const totalCap=rooms.reduce((a,r)=>a+r.rows*r.cols,0),N=data.students.length;
  const placed=[];let unseated=0;
  if(N>totalCap){unseated=N-totalCap;log.push(["bad",`Not enough seats: ${N} students, ${totalCap} seats. ${unseated} students cannot be seated. Add a room.`])}
  // 1. deal students to rooms: biggest subject first, round-robin weighted by capacity, so each room mixes subjects
  const bySub=Array.from({length:data.nSub},()=>[]);
  data.students.forEach(s=>bySub[s.subject].push(s));
  const seatable=Math.min(N,totalCap),quota=rooms.map(r=>Math.floor(seatable*r.rows*r.cols/totalCap));
  let rem=seatable-quota.reduce((a,b)=>a+b,0);for(let i=0;rem>0;i=(i+1)%rooms.length,rem--)quota[i]++;
  const assigned=rooms.map(()=>[]);
  const order=[].concat(...bySub.sort((a,b)=>b.length-a.length));
  let ri=0;for(const s of order.slice(0,seatable)){let g=0;while(assigned[ri].length>=quota[ri]&&g++<rooms.length)ri=(ri+1)%rooms.length;assigned[ri].push(s);ri=(ri+1)%rooms.length}
  // 2. lay out each room: no same subject left/right, front/back; spare seats left empty before any bending
  const out=rooms.map((room,k)=>{
    const {rows,cols}=room,cap=rows*cols,grid=Array.from({length:rows},()=>Array(cols).fill(null));
    const pool=Array.from({length:data.nSub},()=>[]);assigned[k].forEach(s=>pool[s.subject].push(s));
    let spare=cap-assigned[k].length,bent=0,left=assigned[k].length;
    for(let r=0;r<rows&&left>0;r++)for(let c=0;c<cols&&left>0;c++){
      const bad=new Set();if(c>0&&grid[r][c-1])bad.add(grid[r][c-1].subject);if(r>0&&grid[r-1][c])bad.add(grid[r-1][c].subject);
      let best=-1;pool.forEach((p,i)=>{if(p.length&&!bad.has(i)&&(best<0||p.length>pool[best].length))best=i});
      if(best<0){ if(spare>0){spare--;continue} // leave empty rather than break the rule
        pool.forEach((p,i)=>{if(p.length&&(best<0||p.length>pool[best].length))best=i});bent++}
      const s=pool[best].pop();s.bent=bad.has(s.subject);grid[r][c]=s;left--;
    }
    if(left>0)log.push(["bad",`${room.id}: ${left} students did not fit after layout.`]);
    return{room,grid,count:assigned[k].length,bent};
  });
  out.forEach(o=>{ if(o.bent)log.push(["warn",`${o.room.id}: ${o.bent} same-subject neighbours unavoidable. Room is full and one subject dominates. Shown with red outline. Fix: move a student to a roomier hall.`]);
    else log.push(["ok",`${o.room.id}: ${o.count} students, no same-subject neighbours.`]) });
  // 3. invigilators: need ceil(n/30) per room, biggest rooms served first
  const need=out.map(o=>Math.max(1,Math.ceil(o.count/PER_INV)));const pool2=invs.slice();
  const roster={};out.map((o,i)=>i).sort((a,b)=>out[b].count-out[a].count).forEach(i=>{roster[i]=pool2.splice(0,need[i])});
  out.forEach((o,i)=>{o.inv=roster[i];const short=need[i]-o.inv.length;
    if(short>0)log.push(["bad",`${o.room.id} needs ${need[i]} invigilator(s) but only ${o.inv.length} free. Rule bent: ratio above 1 per ${PER_INV} students.`]) });
  log.push(pool2.length?["ok",`${pool2.length} invigilator(s) spare: ${pool2.map(x=>x.id).join(", ")}.`]:["warn","No spare invigilators."]);
  const ms=(performance.now()-t0).toFixed(1);
  const violations=verify(out);
  return{out,log,ms,violations,unseated};
}
/* independent checker – recounts every rule from the final plan */
function verify(out){let adj=0,dup=0,over=0;const seen=new Set(),invSeen=new Set();
  out.forEach(o=>{const {rows,cols}=o.room;let n=0;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const s=o.grid[r][c];if(!s)continue;n++;
      if(seen.has(s.id))dup++;seen.add(s.id);
      if(c+1<cols&&o.grid[r][c+1]&&o.grid[r][c+1].subject===s.subject)adj++;
      if(r+1<rows&&o.grid[r+1][c]&&o.grid[r+1][c].subject===s.subject)adj++}
    if(n>rows*cols)over++;o.inv.forEach(i=>{if(invSeen.has(i.id))dup++;invSeen.add(i.id)})});
  return{adj,dup,over}}
/* ---- render ---- */
function render(){
  const p=plan(),map={};p.out.forEach(o=>o.grid.forEach((row,r)=>row.forEach((s,c)=>{if(s)map[s.id]=o.room.id+":"+r+","+c})));
  let moved=0;if(prev)for(const id in map)if(prev[id]!==map[id])moved++;
  $("stats").innerHTML=`<div><b>${p.ms} ms</b>time to plan</div><div><b>${data.students.length-p.unseated}/${data.students.length}</b>students seated</div><div><b class="${p.violations.adj+p.violations.dup+p.violations.over?"bad":"ok"}">${p.violations.adj+p.violations.dup+p.violations.over}</b>rule violations (re-checked)</div>`+(prev?`<div><b>${moved}</b>students changed seat</div>`:"");
  $("log").innerHTML=p.log.map(([c,t])=>`<li class="${c}">${t}</li>`).join("");
  $("rooms").innerHTML=p.out.map(o=>`<div class="room"><h3>${o.room.id} <small>${o.count}/${o.room.rows*o.room.cols} seats · ${o.inv.map(i=>i.id).join(", ")||"no invigilator"}</small></h3>
  <div class="grid" style="grid-template-columns:repeat(${o.room.cols},1fr)">${o.grid.map(row=>row.map(s=>s?`<div class="seat${s.bent?" bent":""}" style="background:${COLORS[s.subject]}" title="Student ${s.id}, subject ${s.subject+1}">${s.id}</div>`:`<div class="seat empty"></div>`).join("")).join("")}</div></div>`).join("");
  prev=map;
}
$("gen").onclick=()=>{generate();render()};
$("dropR").onclick=()=>{state.deadRooms.add($("selR").value);render()};
$("dropI").onclick=()=>{state.deadInv.add($("selI").value);render()};
$("reset").onclick=()=>{state={deadRooms:new Set(),deadInv:new Set()};render()};
generate();render();
</script></body></html>
